<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>omari</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Bebas+Neue&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>

/* ============================================================
   TOKENS
   ============================================================ */
:root {
  --bg:          #070709;
  --card-bg:     #101012;
  --silver-hi:   #eaedf3;
  --silver-mid:  #c8cdd6;
  --silver-dim:  #6a7280;
  --silver-ch:   #a8b0bc;
  --border:      rgba(200,205,214,0.14);
  --divider:     rgba(200,205,214,0.07);
}

/* ============================================================
   RESET & BASE
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
}

body {
  background: var(--bg);
  min-height: 100vh;
  min-height: 100dvh;
  font-family: "DM Mono", monospace;
  position: relative;
  overflow-x: hidden;
}

/* ============================================================
   BACKGROUND LAYERS
   ============================================================ */
.bg {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: blur(6px) saturate(0.18) brightness(0.13);
  z-index: 0;
}

/* noise texture overlay */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
  opacity: 0.035;
  z-index: 1;
  pointer-events: none;
}

/* inset frame */
.frame {
  position: fixed;
  inset: 14px;
  border: 1px solid var(--border);
  z-index: 6;
  pointer-events: none;
}

/* corner ornaments */
.co {
  position: fixed;
  width: 14px;
  height: 14px;
  z-index: 7;
  pointer-events: none;
}
.co::before, .co::after {
  content: "";
  position: absolute;
  background: var(--silver-ch);
  opacity: 0.45;
}
.co::before { width: 100%; height: 1px; top: 0; left: 0; }
.co::after  { width: 1px; height: 100%; top: 0; left: 0; }
.co.tl { top: 14px; left: 14px; }
.co.tr { top: 14px; right: 14px; transform: rotate(90deg); }
.co.bl { bottom: 14px; left: 14px; transform: rotate(270deg); }
.co.br { bottom: 14px; right: 14px; transform: rotate(180deg); }

/* ============================================================
   CONTENT
   ============================================================ */
.wrap {
  position: relative;
  z-index: 3;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 48px 24px;
  gap: 22px;
}

.avatar {
  width: 96px;
  height: 96px;
  border-radius: 50%;
  object-fit: cover;
  box-shadow: 0 4px 24px rgba(0,0,0,0.85);
  border: 1px solid var(--border);
}

.idgroup {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
}

.name {
  font-family: "Cormorant Garamond", serif;
  font-style: italic;
  font-weight: 400;
  font-size: clamp(32px, 9vw, 46px);
  letter-spacing: 0.05em;
  color: var(--silver-ch);
  line-height: 1;
}

.rule {
  width: min(220px, 60vw);
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(200,205,214,0.28), transparent);
  margin: 4px 0 2px;
}

/* --- LINK LIST --- */
.links {
  width: min(360px, 100%);
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.link-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  background: rgba(16,16,18,0.55);
  border: 1px solid var(--border);
  color: var(--silver-mid);
  font-family: "DM Mono", monospace;
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  text-decoration: none;
  padding: 14px 16px;
  transition: all 0.2s ease;
}

.link-row:hover {
  background: rgba(200,205,214,0.06);
  border-color: rgba(200,205,214,0.3);
  color: var(--silver-hi);
}

.link-row .ic {
  width: 13px;
  height: 13px;
  flex-shrink: 0;
  opacity: 0.85;
}

</style>
</head>
<body>

  </div>


</div>

</body>
