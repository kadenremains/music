<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>omari</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Bebas+Neue&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>

/* ============================================================
   TOKENS
   ============================================================ */
:root {
  --bg:          #070709;
  --card-bg:     #101012;
  --silver-hi:   #eaedf3;
  --silver-mid:  #c8cdd6;
  --silver-dim:  #6a7280;
  --silver-ch:   #a8b0bc;
  --border:      rgba(200,205,214,0.14);
  --divider:     rgba(200,205,214,0.07);
}

/* ============================================================
   RESET & BASE
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
}

body {
  background: var(--bg);
  min-height: 100vh;
  min-height: 100dvh;
  font-family: "DM Mono", monospace;
  position: relative;
  overflow-x: hidden;
}

/* ============================================================
   BACKGROUND LAYERS
   ============================================================ */
.bg {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: blur(6px) saturate(0.18) brightness(0.13);
  z-index: 0;
}

/* noise texture overlay */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
  opacity: 0.035;
  z-index: 1;
  pointer-events: none;
}

/* inset frame */
.frame {
  position: fixed;
  inset: 14px;
  border: 1px solid var(--border);
  z-index: 6;
  pointer-events: none;
}

/* corner ornaments */
.co {
  position: fixed;
  width: 14px;
  height: 14px;
  z-index: 7;
  pointer-events: none;
}
.co::before, .co::after {
  content: "";
  position: absolute;
  background: var(--silver-ch);
  opacity: 0.45;
}
.co::before { width: 100%; height: 1px; top: 0; left: 0; }
.co::after  { width: 1px; height: 100%; top: 0; left: 0; }
.co.tl { top: 14px; left: 14px; }
.co.tr { top: 14px; right: 14px; transform: rotate(90deg); }
.co.bl { bottom: 14px; left: 14px; transform: rotate(270deg); }
.co.br { bottom: 14px; right: 14px; transform: rotate(180deg); }

/* ============================================================
   LAYOUT — mobile: single stacked column, song first
   ============================================================ */
.wrap {
  position: relative;
  z-index: 3;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 56px 24px;
  gap: 52px;
}

.divider {
  display: none;
}

/* ============================================================
   LAYOUT — desktop: split in half, song left / socials right
   ============================================================ */
@media (min-width: 820px) {
  .wrap {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    justify-items: center;
    column-gap: 56px;
    padding: 48px 64px;
  }
  .divider {
    display: block;
    width: 1px;
    align-self: stretch;
    background: var(--divider);
  }
}

/* ============================================================
   SONG SECTION
   ============================================================ */
.song {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}

.cover {
  width: min(220px, 60vw);
  height: min(220px, 60vw);
  object-fit: cover;
  border: 1px solid var(--border);
  box-shadow: 0 4px 24px rgba(0,0,0,0.85);
}

.song-title {
  font-family: "Bebas Neue", sans-serif;
  font-size: clamp(20px, 5vw, 27px);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--silver-hi);
  text-align: center;
  line-height: 1.25;
  max-width: 300px;
}

/* --- mini player --- */
.player {
  display: flex;
  align-items: center;
  gap: 12px;
  width: min(260px, 80vw);
}

.play-btn {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  flex-shrink: 0;
  border: 1px solid var(--border);
  background: rgba(16,16,18,0.55);
  color: var(--silver-hi);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s ease;
}
.play-btn:hover {
  background: rgba(200,205,214,0.06);
  border-color: rgba(200,205,214,0.3);
}
.play-btn svg {
  width: 12px;
  height: 12px;
}

.player-bar {
  position: relative;
  flex: 1;
  height: 2px;
  background: var(--divider);
  cursor: pointer;
}
.player-fill {
  position: absolute;
  left: 0;
  top: 0;
  height: 100%;
  width: 0%;
  background: var(--silver-ch);
}

/* --- presave CTA --- */
.presave-btn {
  border-color: rgba(200,205,214,0.3);
  color: var(--silver-hi);
}
.presave-btn:hover {
  background: rgba(200,205,214,0.1);
  border-color: rgba(200,205,214,0.5);
}

/* ============================================================
   SOCIAL / IDENTITY SECTION
   ============================================================ */
.social {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 22px;
}

.avatar {
  width: 96px;
  height: 96px;
  border-radius: 50%;
  object-fit: cover;
  box-shadow: 0 4px 24px rgba(0,0,0,0.85);
  border: 1px solid var(--border);
}

.idgroup {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
}

.name {
  font-family: "Cormorant Garamond", serif;
  font-style: italic;
  font-weight: 400;
  font-size: clamp(32px, 9vw, 46px);
  letter-spacing: 0.05em;
  color: var(--silver-ch);
  line-height: 1;
}

.rule {
  width: min(220px, 60vw);
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(200,205,214,0.28), transparent);
  margin: 4px 0 2px;
}

/* --- LINK LIST --- */
.links {
  width: min(360px, 100%);
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.link-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  background: rgba(16,16,18,0.55);
  border: 1px solid var(--border);
  color: var(--silver-mid);
  font-family: "DM Mono", monospace;
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  text-decoration: none;
  padding: 14px 16px;
  transition: all 0.2s ease;
}

.link-row:hover {
  background: rgba(200,205,214,0.06);
  border-color: rgba(200,205,214,0.3);
  color: var(--silver-hi);
}

.link-row .ic {
  width: 13px;
  height: 13px;
  flex-shrink: 0;
  opacity: 0.85;
}

</style>
</head>
<body>

<!-- swap this src for your actual pfp path -->
<img class="bg" src="./pfp.jpg" alt="">

<div class="wrap">

  <!-- SONG PROMO -->
  <div class="song">
    <img class="cover" src="./cover.jpg" alt="HELL (feat. geekstar*) cover art">
    <div class="song-title">HELL (feat. geekstar*)</div>

    <div class="player">
      <button class="play-btn" id="playBtn" aria-label="Play preview" type="button">
        <svg id="iconPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg id="iconPause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
      </button>
      <div class="player-bar" id="playerBar">
        <div class="player-fill" id="playerFill"></div>

    <a class="link-row presave-btn" href="https://distrokid.com/hyperfollow/omari23/hell-feat-geekstar" target="_blank" rel="noopener">

  <div class="divider"></div>

  <!-- SOCIALS / IDENTITY -->

    <img class="avatar" src="./pfp.jpg" alt="omari">

    <div class="idgroup">
      <div class="name">omari!</div>
    </div>

    <div class="rule"></div>

    <div class="links">

      <a class="link-row" href="#" target="_blank" rel="noopener">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="1.1" fill="currentColor" stroke="none"/></svg>
        Instagram
      </a>

      <a class="link-row" href="#" target="_blank" rel="noopener">
        <svg class="ic" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M18.9 2H22l-7.4 8.4L23.3 22H16.8l-5.1-6.7L5.8 22H2.7l7.9-9L1.7 2h6.6l4.6 6.1L18.9 2zm-1.1 18h1.7L7.2 3.9H5.4l12.4 16.1z"/></svg>

        <svg class="ic" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm4.6 14.4c-.2.3-.5.4-.8.2-2.2-1.3-4.9-1.6-8.2-.9-.3.1-.6-.1-.7-.4-.1-.3.1-.6.4-.7 3.5-.8 6.5-.4 9 1 .3.2.4.5.3.8zm1.2-2.7c-.2.4-.6.5-1 .3-2.5-1.5-6.3-2-9.3-1.1-.4.1-.8-.1-.9-.5-.1-.4.1-.8.5-.9 3.4-1 7.6-.5 10.5 1.2.4.2.5.6.2 1zm.1-2.8C14.7 9.1 9.9 8.9 7.1 9.8c-.5.1-1-.2-1.1-.6-.1-.5.2-1 .6-1.1 3.3-1 8.6-.8 12 1.2.4.3.6.9.3 1.3-.3.4-.9.5-1.3.3z"/></svg>

    </div>

  </div>

</div>

<div class="frame"></div>
<div class="co tl"></div>
<div class="co tr"></div>
<div class="co bl"></div>
<div class="co br"></div>

<script>
(function () {
  var audio = document.getElementById('preview');
  var playBtn = document.getElementById('playBtn');
  var iconPlay = document.getElementById('iconPlay');
  var iconPause = document.getElementById('iconPause');
  var bar = document.getElementById('playerBar');
  var fill = document.getElementById('playerFill');

  playBtn.addEventListener('click', function () {
    if (audio.paused) { audio.play(); } else { audio.pause(); }
  });

  audio.addEventListener('play', function () {
    iconPlay.style.display = 'none';
    iconPause.style.display = '';
  });

  audio.addEventListener('pause', function () {
    iconPlay.style.display = '';
    iconPause.style.display = 'none';
  });

  audio.addEventListener('timeupdate', function () {
    if (audio.duration) {
      fill.style.width = (audio.currentTime / audio.duration * 100) + '%';
    }
  });

  audio.addEventListener('ended', function () {
    fill.style.width = '0%';
  });

  bar.addEventListener('click', function (e) {
    var rect = bar.getBoundingClientRect();
    var ratio = (e.clientX - rect.left) / rect.width;
    if (audio.duration) {
      audio.currentTime = ratio * audio.duration;
    }
  });
})();
</script>

</body>
</html>
