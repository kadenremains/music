<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>omari</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Bebas+Neue&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>

/* ============================================================
   TOKENS
   ============================================================ */
:root {
  --bg:          #070709;
  --card-bg:     #101012;
  --silver-hi:   #eaedf3;
  --silver-mid:  #c8cdd6;
  --silver-dim:  #6a7280;
  --silver-ch:   #a8b0bc;
  --border:      rgba(200,205,214,0.14);
  --divider:     rgba(200,205,214,0.07);
}

/* ============================================================
   RESET & BASE
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
}

body {
  background: var(--bg);
  min-height: 100vh;
  min-height: 100dvh;
  font-family: "DM Mono", monospace;
  position: relative;
  overflow-x: hidden;
}

/* ============================================================
   BACKGROUND LAYERS
   ============================================================ */
.bg {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: blur(6px) saturate(0.18) brightness(0.13);
  z-index: 0;
}

/* noise texture overlay */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
  opacity: 0.035;
  z-index: 1;
  pointer-events: none;
}

/* inset frame */
.frame {
  position: fixed;
  inset: 14px;
  border: 1px solid var(--border);
  z-index: 6;
  pointer-events: none;
}

/* corner ornaments */
.co {
  position: fixed;
  width: 14px;
  height: 14px;
  z-index: 7;
  pointer-events: none;
}
.co::before, .co::after {
  content: "";
  position: absolute;
  background: var(--silver-ch);
  opacity: 0.45;
}
.co::before { width: 100%; height: 1px; top: 0; left: 0; }
.co::after  { width: 1px; height: 100%; top: 0; left: 0; }
.co.tl { top: 14px; left: 14px; }
.co.tr { top: 14px; right: 14px; transform: rotate(90deg); }
.co.bl { bottom: 14px; left: 14px; transform: rotate(270deg); }
.co.br { bottom: 14px; right: 14px; transform: rotate(180deg); }

/* ============================================================
   LAYOUT — mobile: single stacked column, song first
   ============================================================ */
.wrap {
  position: relative;
  z-index: 3;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 56px 24px;
  gap: 44px;
}

.divider {
  display: none;
}

/* mobile: clip everything to the inset frame instead of letting it
   scroll past the border — the frame becomes the scrollable viewport */
@media (max-width: 819px) {
  html, body {
    overflow: hidden;
  }
  .wrap {
    position: fixed;
    inset: 14px;
    min-height: 0;
    justify-content: flex-start;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    padding-top: 36px;
    padding-left: 22px;
    padding-right: 22px;
    padding-bottom: calc(72px + env(safe-area-inset-bottom, 0px));
  }
}

/* ============================================================
   LAYOUT — desktop: split in half, song left / socials right
   ============================================================ */
@media (min-width: 820px) {
  .wrap {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    justify-items: center;
    column-gap: 72px;
    padding: 48px 40px;
  }
  .divider {
    display: block;
    width: 1px;
    align-self: stretch;
    background: var(--divider);
  }
}

/* ============================================================
   FADE-IN
   mobile: one continuous top-to-bottom cascade down the page
   desktop: both columns cascade top-to-bottom in parallel
   ============================================================ */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}
.fade {
  opacity: 0;
  animation: fadeInUp 0.7s ease forwards;
  animation-delay: calc(var(--mi, 0) * 90ms);
}
@media (min-width: 820px) {
  .fade {
    animation-delay: calc(var(--di, 0) * 90ms);
  }
}

/* ============================================================
   SONG SECTION
   ============================================================ */
.song {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}

.cover {
  width: min(220px, 60vw);
  height: min(220px, 60vw);
  object-fit: cover;
  border: 1px solid var(--border);
  box-shadow: 0 4px 24px rgba(0,0,0,0.85);
}

.song-titlegroup {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
}

.song-title {
  font-family: "Bebas Neue", sans-serif;
  font-size: clamp(20px, 5vw, 27px);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--silver-hi);
  text-align: center;
  line-height: 1.25;
  max-width: 300px;
}

.song-sub {
  font-family: "Cormorant Garamond", serif;
  font-style: italic;
  font-size: 12px;
  color: var(--silver-ch);
  letter-spacing: 0.04em;
}

/* --- mini player --- */
.player {
  display: flex;
  align-items: center;
  gap: 12px;
  width: min(260px, 80vw);
}

.play-btn {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  flex-shrink: 0;
  border: 1px solid var(--border);
  background: rgba(16,16,18,0.55);
  color: var(--silver-hi);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s ease;
}
.play-btn:hover {
  background: rgba(200,205,214,0.06);
  border-color: rgba(200,205,214,0.3);
}
.play-btn svg {
  width: 12px;
  height: 12px;
}

/* generous invisible hit area — the visible line is just .player-track */
.player-bar {
  position: relative;
  flex: 1;
  height: 22px;
  display: flex;
  align-items: center;
  cursor: pointer;
  touch-action: none;
}
.player-track {
  position: relative;
  width: 100%;
  height: 2px;
  background: var(--divider);
  transition: height 0.15s ease;
}
.player-bar:hover .player-track,
.player-bar.scrubbing .player-track {
  height: 3px;
}
.player-fill {
  position: absolute;
  left: 0;
  top: 0;
  height: 100%;
  width: 0%;
  background: var(--silver-ch);
}
/* the classic scrub "bubble" — hidden until you hover or drag */
.player-thumb {
  position: absolute;
  top: 50%;
  left: 0%;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--silver-hi);
  box-shadow: 0 0 0 5px rgba(234,237,243,0.14), 0 2px 6px rgba(0,0,0,0.7);
  transform: translate(-50%, -50%) scale(0);
  transition: transform 0.15s ease;
  pointer-events: none;
}
.player-bar:hover .player-thumb,
.player-bar.scrubbing .player-thumb {
  transform: translate(-50%, -50%) scale(1);
}

/* --- release countdown --- */
.release-label {
  font-size: 8px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--silver-dim);
}

.countdown {
  display: flex;
  align-items: flex-start;
  gap: 6px;
}
.cd-unit {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  min-width: 28px;
}
.cd-num {
  font-family: "Bebas Neue", sans-serif;
  font-size: 20px;
  letter-spacing: 0.02em;
  color: var(--silver-hi);
  line-height: 1;
}
.cd-lbl {
  font-size: 6px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--silver-dim);
}
.cd-sep {
  font-family: "Bebas Neue", sans-serif;
  font-size: 18px;
  color: var(--silver-dim);
  margin-top: 1px;
}

/* --- presave CTA --- */
.presave-btn {
  border-color: rgba(200,205,214,0.3);
  color: var(--silver-hi);
}
.presave-btn:hover {
  background: rgba(200,205,214,0.1);
  border-color: rgba(200,205,214,0.5);
}

/* ============================================================
   SOCIAL / IDENTITY SECTION
   ============================================================ */
.social {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 22px;
}

.avatar {
  width: 96px;
  height: 96px;
  border-radius: 50%;
  object-fit: cover;
  box-shadow: 0 4px 24px rgba(0,0,0,0.85);
  border: 1px solid var(--border);
}

.idgroup {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
}

.name {
  font-family: "Bebas Neue", sans-serif;
  text-transform: uppercase;
  font-size: clamp(32px, 9vw, 46px);
  letter-spacing: 0.1em;
  color: var(--silver-hi);
  line-height: 1;
}

.rule {
  width: min(220px, 60vw);
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(200,205,214,0.28), transparent);
  margin: 4px 0 2px;
}

/* --- LINK LIST --- */
.links {
  width: min(360px, 100%);
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.link-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  background: rgba(16,16,18,0.55);
  border: 1px solid var(--border);
  color: var(--silver-mid);
  font-family: "DM Mono", monospace;
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  text-decoration: none;
  padding: 14px 16px;
  transition: all 0.2s ease;
}

.link-row:hover {
  background: rgba(200,205,214,0.06);
  border-color: rgba(200,205,214,0.3);
  color: var(--silver-hi);
}

.link-row .ic {
  width: 13px;
  height: 13px;
  flex-shrink: 0;
  opacity: 0.85;
}

/* ============================================================
   DESKTOP SCALE-UP
   comes after every component's base rule above so it actually
   wins the cascade instead of being overridden by them
   ============================================================ */
@media (min-width: 820px) {
  .cover {
    width: clamp(280px, 25vw, 420px);
    height: clamp(280px, 25vw, 420px);
  }
  .song-title {
    font-size: clamp(34px, 3.8vw, 52px);
    max-width: 460px;
  }
  .song-sub {
    font-size: 16px;
  }
  .player {
    width: clamp(300px, 23vw, 400px);
  }
  .play-btn {
    width: 46px;
    height: 46px;
  }
  .play-btn svg {
    width: 16px;
    height: 16px;
  }
  .release-label {
    font-size: 11px;
  }
  .cd-num {
    font-size: 34px;
  }
  .cd-sep {
    font-size: 30px;
  }
  .cd-unit {
    min-width: 40px;
  }
  .avatar {
    width: clamp(150px, 13vw, 200px);
    height: clamp(150px, 13vw, 200px);
  }
  .name {
    font-size: clamp(58px, 6.5vw, 84px);
  }
  .rule {
    width: clamp(260px, 22vw, 360px);
  }
  .links {
    width: clamp(380px, 29vw, 480px);
  }
  .link-row {
    padding: 18px 22px;
    font-size: 13px;
  }
}

</style>
</head>
<body>

<script>
(function () {
  var audio = document.getElementById('preview');
  var playBtn = document.getElementById('playBtn');
  var iconPlay = document.getElementById('iconPlay');
  var iconPause = document.getElementById('iconPause');
  var bar = document.getElementById('playerBar');
  var fill = document.getElementById('playerFill');
  var thumb = document.getElementById('playerThumb');
  var dragging = false;

  playBtn.addEventListener('click', function () {
    if (audio.paused) { audio.play(); } else { audio.pause(); }
  });

  audio.addEventListener('play', function () {
    iconPlay.style.display = 'none';
    iconPause.style.display = '';
  });

  audio.addEventListener('pause', function () {
    iconPlay.style.display = '';
    iconPause.style.display = 'none';
  });

  function setBarUI(ratio) {
    var pct = (ratio * 100) + '%';
    fill.style.width = pct;
    thumb.style.left = pct;
  }

  audio.addEventListener('timeupdate', function () {
    if (audio.duration && !dragging) {
      setBarUI(audio.currentTime / audio.duration);
    }
  });

  audio.addEventListener('ended', function () {
    setBarUI(0);
  });

  function ratioFromEvent(e) {
    var clientX = e.touches ? e.touches[0].clientX : e.clientX;
    var rect = bar.getBoundingClientRect();
    return Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
  }

  function onPointerDown(e) {
    dragging = true;
    bar.classList.add('scrubbing');
    var ratio = ratioFromEvent(e);
    setBarUI(ratio);
    if (audio.duration) { audio.currentTime = ratio * audio.duration; }
    e.preventDefault();
  }

  function onPointerMove(e) {
    if (!dragging) { return; }
    var ratio = ratioFromEvent(e);
    setBarUI(ratio);
    if (audio.duration) { audio.currentTime = ratio * audio.duration; }
  }

  function onPointerUp() {
    dragging = false;
    bar.classList.remove('scrubbing');
  }

  bar.addEventListener('mousedown', onPointerDown);
  bar.addEventListener('touchstart', onPointerDown, { passive: false });
  window.addEventListener('mousemove', onPointerMove);
  window.addEventListener('touchmove', onPointerMove, { passive: false });
  window.addEventListener('mouseup', onPointerUp);
  window.addEventListener('touchend', onPointerUp);
})();

(function () {
  var target = new Date('2026-08-13T00:00:00-04:00').getTime();
  var elDays = document.getElementById('cdDays');
  var elHours = document.getElementById('cdHours');
  var elMins = document.getElementById('cdMins');
  var elSecs = document.getElementById('cdSecs');

  function pad(n) {
    return String(n).padStart(2, '0');
  }

  function tick() {
    var diff = Math.max(0, target - Date.now());
    var days = Math.floor(diff / 86400000);
    var hours = Math.floor((diff % 86400000) / 3600000);
    var mins = Math.floor((diff % 3600000) / 60000);
    var secs = Math.floor((diff % 60000) / 1000);
    elDays.textContent = pad(days);
    elHours.textContent = pad(hours);
    elMins.textContent = pad(mins);
    elSecs.textContent = pad(secs);
  }

  tick();
  setInterval(tick, 1000);
})();
</script>
